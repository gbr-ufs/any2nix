<form action="/convert/{{ format|lower }}" hx-post="/convert/{{ format|lower }}" hx-swap="outerHTML" method="POST" class="center-align row vertical">
  <div aria-label="editor" class="editor language-{{ format|lower }}" id="editor-{{ format|lower }}" role="textbox"></div>
  <input type="hidden" id="input-{{ format|lower }}" name="input">
  <nav class="center-align wrap">
    <label class="button border htmx-indicator-hide">
      <i>attach_file</i>
      <span>{{ i18n.attach_file }}</span>
      <input type="file" class="file-input" style="display: none;">
    </label>
    <button type="submit" class="htmx-indicator-hide">{{ i18n.submit }}</button>
    <button type="button" class="shape loading-indicator htmx-indicator" disabled></button>
  </nav>
</form>
