[package]
authors.workspace = true
categories = ["config", "development-tools", "encoding", "parsing"]
description = "Serialization-powered Nix Converter."
edition = "2024"
keywords = ["converter", "nix", "serde", "toml", "yaml"]
license.workspace = true
name = "any2nix"
repository.workspace = true
version = "0.1.3"

[dependencies]
clap = { features = ["derive"], optional = true, version = "4.6.6" }
ser_nix = "0.2.4"
serde = "1.0.229"
serde_ini = { optional = true, version = "0.2.0" }
serde_json = { optional = true, version = "1.0.151" }
strum = { features = ["derive"], version = "0.28.0" }
thiserror = "2.0.20"
toml = { optional = true, version = "1.1.4" }
utoipa = { optional = true, version = "5.5.0" }
yaml_serde = { optional = true, version = "0.10.7" }

[features]
clap = ["dep:clap"]
default = ["ini", "json", "toml", "yaml"]
ini = ["dep:serde_ini", "dep:serde_json"]
json = ["dep:serde_json"]
toml = ["dep:toml"]
utoipa = ["dep:utoipa"]
yaml = ["dep:yaml_serde"]
