[package]
authors.workspace = true
name = "any2nix"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Serialization-powered Nix Converter."
repository.workspace = true
categories = [
  "config",
  "development-tools",
  "encoding",
  "parsing"
]
keywords = [
  "nix",
  "serde",
  "converter",
  "toml",
  "yaml"
]

[dependencies]
ser_nix = "0.2.4"
serde = "1.0.229"
serde_ini = { version = "0.2.0", optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.20"
toml = { version = "1.1.4", optional = true }
yaml_serde = { version = "0.10.7", optional = true }

[features]
default = ["ini", "json", "toml", "yaml"]
ini = ["dep:serde_ini", "dep:serde_json"]
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:yaml_serde"]
