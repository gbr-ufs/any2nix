services:
  any2nix-api:
    build:
      args:
        - CRATE="any2nix-api"
      context: .
      target: dev
    ports:
      - 3000:3000
    restart: unless-stopped
  any2nix-website:
    build:
      args:
        - CRATE="any2nix-website"
      context: .
      target: dev
    ports:
      - 3001:3000
    restart: unless-stopped
