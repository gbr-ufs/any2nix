[git_hooks.commit-msg]
script = """
  #!/bin/sh

  set -e

  cog verify --file "$1"
  """
[git_hooks.pre-commit]
script = """
  #!/bin/sh

  set -e

  cargo fmt --all --check
  cargo clippy --all-targets --workspace -- -D warnings
"""
[git_hooks.pre-push]
script = """
  #!/bin/sh

  set -e

  cog check
  cargo cov
"""
