[workspace]
resolver = "3"
members = [
  "any2nix",
  "any2nix-api",
  "any2nix-cli",
  "any2nix-gui",
  "any2nix-site",
]

[workspace.dependencies]
any2nix = { version = "0.1.0", path = "./any2nix", default-features = false }

[workspace.package]
authors = [ "Gabriel Santos de Souza <gabriel.santosdesouza@dcomp.ufs.br>" ]
license = "GPL-3.0-or-later"
repository = "https://git.gs-101.dev/gs-101/any2nix"
