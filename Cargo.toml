[workspace]
members = [
  "any2nix",
  "any2nix-api",
  "any2nix-cli",
  "any2nix-gui",
  "any2nix-i18n",
  "any2nix-website",
]
resolver = "3"

[workspace.dependencies]
any2nix = { default-features = false, path = "./any2nix", version = "0.1.1" }
any2nix-i18n = { default-features = false, path = "./any2nix-i18n", version = "0.1.0" }

[workspace.package]
authors = ["Gabriel Santos de Souza <gabriel.santosdesouza@dcomp.ufs.br>"]
license = "GPL-3.0-or-later"
repository = "https://git.gs-101.dev/gs-101/any2nix"
